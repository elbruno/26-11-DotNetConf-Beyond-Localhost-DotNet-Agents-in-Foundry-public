# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: decision-agent-01-foundry-hosted
services:
  existing-project:
    host: azure.ai.project
    endpoint: ${AZURE_AI_PROJECT_ENDPOINT}
  netconf-support-routing:
    project: ./src/SupportRoutingAgent
    host: azure.ai.agent
    language: csharp
    uses:
      - existing-project
    env:
      Decision__Endpoint: ${DECISION_ENDPOINT}
      Decision__Deployment: ${DECISION_DEPLOYMENT}
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false"
    codeConfiguration:
      dependencyResolution: bundled
      entryPoint: SupportRoutingAgent.dll
      runtime: dotnet_10
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    kind: hosted
    name: netconf-support-routing
    protocols:
      - protocol: responses
        version: 2.0.0
infra:
  provider: microsoft.foundry
